<!-- アプリのアイコンです。
     app/icon.svg という名前で置くと、Next.js が
     タブの印やホーム画面のアイコンとして自動で使ってくれます。

     形は components/AwajiKnot.tsx と同じあわじ結びです。
     太い背景色の線で紐の隠れる部分を作り、編み込みに見せています。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#faf8f3" />
  <g transform="translate(256 256) scale(2.1)" fill="none" stroke-linecap="round">
    <g transform="rotate(0)">
      <ellipse cx="22" cy="0" rx="26" ry="14" stroke="#faf8f3" stroke-width="14" />
      <ellipse cx="22" cy="0" rx="26" ry="14" stroke="#7a8580" stroke-width="7" />
    </g>
    <g transform="rotate(120)">
      <ellipse cx="22" cy="0" rx="26" ry="14" stroke="#faf8f3" stroke-width="14" />
      <ellipse cx="22" cy="0" rx="26" ry="14" stroke="#7a8580" stroke-width="7" />
    </g>
    <g transform="rotate(240)">
      <ellipse cx="22" cy="0" rx="26" ry="14" stroke="#faf8f3" stroke-width="14" />
      <ellipse cx="22" cy="0" rx="26" ry="14" stroke="#7a8580" stroke-width="7" />
    </g>
  </g>
</svg>
